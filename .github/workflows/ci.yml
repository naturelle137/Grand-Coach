# SPDX-License-Identifier: EUPL-1.2
name: CI

# Verification gate (D-30, docs/testing.md). `ci-ok` is the single required
# status check on `main`; the jobs only call `scripts/check.sh`, so hooks,
# agents and CI run the same checks.

on:
  pull_request:
  push:
    branches: [main]
  # Also dispatched by implement-issue.yml: PRs opened with GITHUB_TOKEN do
  # not trigger `pull_request` runs.
  workflow_dispatch:
    inputs:
      deep:
        description: 'Also run the deep random-game soak'
        type: boolean
        default: false
  schedule:
    - cron: '23 3 * * 1' # weekly deep run, Monday 03:23 UTC

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Check out exactly the committed bytes (LF) on Windows, too.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh full
        shell: bash

  # The declared `rust-version` must stay true.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88'
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets --all-features

  deep:
    if: github.event_name == 'schedule' || inputs.deep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh deep

  ci-ok:
    name: ci-ok
    if: always()
    needs: [verify, msrv]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          VERIFY: ${{ needs.verify.result }}
          MSRV: ${{ needs.msrv.result }}
        run: |
          echo "verify=$VERIFY msrv=$MSRV"
          [ "$VERIFY" = success ] && [ "$MSRV" = success ]
