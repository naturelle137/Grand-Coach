# SPDX-License-Identifier: EUPL-1.2
name: Implement issue

# Manually triggered: Claude Code implements exactly the issue passed in and
# opens a regular (non-draft) PR to `main`. No schedule, no automatic issue
# selection, no automated review bots; a human reviews the PR (D-27).

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to implement'
        required: true
        type: string
      model:
        description: 'Model alias or pinned ID (e.g. opus, sonnet)'
        required: false
        type: string
        default: 'opus'
      effort:
        description: 'Reasoning effort (low | medium | high | xhigh | max)'
        required: false
        type: string
        default: 'medium'
      max_turns:
        description: 'Turn budget for the agent'
        required: false
        type: string
        default: '200'

# One run per issue at a time; never cancel an in-flight implementation.
concurrency:
  group: implement-issue-${{ inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write # dispatch CI for the PR (D-30)
  id-token: write # required by anthropics/claude-code-action (OIDC)

jobs:
  implement:
    name: Implement #${{ inputs.issue }}
    runs-on: ubuntu-latest
    # Must exceed what the turn budget can consume, so the agent's own cap is
    # hit first and the push step below can still save partial work.
    timeout-minutes: 150
    env:
      ISSUE: ${{ inputs.issue }}
      BRANCH: claude/issue-${{ inputs.issue }}
    steps:
      - name: Validate issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Issue input must be a number, got '$ISSUE'."
            exit 1
          fi
          STATE=$(gh issue view "$ISSUE" --json state --jq .state) || {
            echo "::error::Issue #$ISSUE not found."
            exit 1
          }
          if [ "$STATE" != "OPEN" ]; then
            echo "::error::Issue #$ISSUE is $STATE, not OPEN."
            exit 1
          fi
          if gh api "repos/$GH_REPO/branches/$BRANCH" --silent 2>/dev/null; then
            echo "::error::Branch $BRANCH already exists; delete it or finish its PR first."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # Always installed, so an issue that creates the Cargo workspace can
      # build and test it, too.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        if: ${{ hashFiles('Cargo.lock') != '' }}
        uses: Swatinem/rust-cache@v2

      # Software Vulkan (lavapipe) for headless frontend screenshots (D-45).
      - name: Install lavapipe
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - name: Create branch
        run: |
          git config user.name 'grand-coach-bot'
          git config user.email 'grand-coach-bot@users.noreply.github.com'
          # The agent's commits pass the pre-commit gate (D-30).
          git config core.hooksPath .githooks
          git switch -c "$BRANCH"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Implement via Claude Code
        id: claude
        # Agent errors (e.g. turn budget exhausted) must not discard partial
        # work; the push step reports the outcome instead.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          # Builds, clippy and tests (and the hooks running them) outlast the
          # default 2-minute Bash timeout; a killed command must not look
          # like a result.
          BASH_DEFAULT_TIMEOUT_MS: '1800000'
          BASH_MAX_TIMEOUT_MS: '3600000'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # API billing instead of the subscription:
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The procedure lives in the project skill
          # `.claude/skills/implement-issue/SKILL.md`; only CI specifics here.
          prompt: |
            /implement-issue ${{ inputs.issue }}

            CI notes (the skill is `.claude/skills/implement-issue/SKILL.md`):
            - You run unattended on branch claude/issue-${{ inputs.issue }},
              already created from `main`. Nobody can answer questions; make
              reasonable decisions and document them in the PR body.
            - End every commit message with
              `Co-Authored-By: Claude <noreply@anthropic.com>`.
            - Do not push, open the PR or edit the issue; the workflow does
              that afterwards. Write instead:
              - the PR title to `$RUNNER_TEMP/pr-title.txt`,
              - the PR body to `$RUNNER_TEMP/pr-body.md`, ending with
                `🤖 Generated with [Claude Code](https://claude.com/claude-code)`,
              - the issue body with the genuinely done checklist items ticked
                to `$RUNNER_TEMP/issue-body.md`. The workflow rejects any
                change other than `[ ]` → `[x]`.
            - Frontend changes: write the screenshots of the skill's step
              "Screenshots" to `$RUNNER_TEMP/screenshots/` (PNG, names
              `[a-z0-9-]+.png`) and embed them in the PR body as
              `![caption](screenshots/<name>.png)`; the workflow uploads them.
            - Do not edit `.github/workflows/**` or security settings.
            - You are done only when all changes are committed, the commit
              and pre-push gate (`scripts/check.sh push --base $BASE_SHA`)
              pass, and the PR title and body are written. If a git hook
              fails, read its output, fix the cause and commit again; never
              stop with a red check, a pending command or a question. A
              Stop hook enforces this. If the issue genuinely needs no code
              change, explain why in `$RUNNER_TEMP/no-change-reason.md`
              (it is posted publicly to the issue).
          # claude-code-action does not grant Bash by default and nobody can
          # approve tool prompts in CI. `Task` enables subagents from
          # `.claude/agents/`. Safety rests on human review of the PR.
          claude_args: |
            --model ${{ inputs.model }}
            --effort ${{ inputs.effort }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,Task,TodoWrite,WebFetch,WebSearch,Skill"

      - name: Push branch and open PR
        id: publish
        # Runs even when the agent failed, so partial work is not lost.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The maintainer's token opens the PR, so the PR is theirs and
          # triggers CI; PRs created with GITHUB_TOKEN trigger no workflows.
          PR_TOKEN: ${{ secrets.PR_CREATION_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PR_TOKEN: ${{ secrets.PR_CREATION_TOKEN != '' }}
          AGENT_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Work the agent left uncommitted must not vanish: commit it here
          # (the agent itself may not skip hooks); the gate below then
          # opens a draft PR.
          if [ -n "$(git status --porcelain)" ]; then
            echo "needs_transcript=true" >> "$GITHUB_OUTPUT"
            git add -A
            git commit --no-verify -m "wip: uncommitted agent changes (#$ISSUE)" \
              -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          fi
          if [ "$(git rev-parse HEAD)" = "$BASE_SHA" ]; then
            REASON="$RUNNER_TEMP/no-change-reason.md"
            if [ -s "$REASON" ] && [ "$AGENT_OUTCOME" = "success" ]; then
              {
                printf '🤖 Claude made no change for this issue ([workflow run](%s)). Reason:\n\n' "$RUN_URL"
                head -c 4000 "$REASON"
              } > "$RUNNER_TEMP/comment.md"
              gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
              exit 0
            fi
            echo "needs_transcript=true" >> "$GITHUB_OUTPUT"
            echo "::error::No commits produced for #$ISSUE (agent outcome: $AGENT_OUTCOME)."
            gh issue comment "$ISSUE" --body \
              "🤖 Claude produced no commits for this issue (agent outcome: \`$AGENT_OUTCOME\`). See the [workflow run]($RUN_URL); its encrypted transcript is attached there if configured."
            exit 1
          fi

          # claude-code-action repoints origin at its own token, which may not
          # be allowed to push; re-establish auth with GH_TOKEN.
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git

          # Full verification gate (D-30), taken from the base commit so the
          # agent's branch cannot weaken it. A red gate still pushes (partial
          # work survives) but opens a draft PR; CI blocks the merge anyway.
          GATE="passed"
          if git cat-file -e "$BASE_SHA:scripts/check.sh" 2>/dev/null; then
            git show "$BASE_SHA:scripts/check.sh" > "$RUNNER_TEMP/check.sh"
            bash "$RUNNER_TEMP/check.sh" full --base "$BASE_SHA" || GATE="failed"
          fi
          if [ "$GATE" != "passed" ]; then
            echo "needs_transcript=true" >> "$GITHUB_OUTPUT"
          fi
          # The gate just ran; skip the pre-push hook.
          git push --no-verify --set-upstream origin "$BRANCH"

          TITLE_FILE="$RUNNER_TEMP/pr-title.txt"
          BODY_FILE="$RUNNER_TEMP/pr-body.md"
          if [ -s "$TITLE_FILE" ]; then
            TITLE=$(head -n 1 "$TITLE_FILE")
          else
            TITLE="feat: $(gh issue view "$ISSUE" --json title --jq .title) (#$ISSUE)"
          fi
          if [ ! -s "$BODY_FILE" ]; then
            printf 'Refs #%s\n\nClaude did not write a PR description; treat this as work in progress.\n' \
              "$ISSUE" > "$BODY_FILE"
          fi
          # Screenshots (D-45): the agent's, or for a frontend change without
          # any, the example's built-in scenarios. Uploaded to the orphan
          # branch `screenshots` and embedded via their raw URLs.
          SHOTS="$RUNNER_TEMP/screenshots"
          SHOT_NOTE=""
          if ! git diff --quiet "$BASE_SHA" HEAD -- crates/gui-egui assets &&
              ! compgen -G "$SHOTS/*.png" > /dev/null; then
            if cargo run --locked -p gui-egui --example screenshots -- "$SHOTS"; then
              SHOT_NOTE="The agent provided no screenshots; these show the built-in scenarios of \`crates/gui-egui/examples/screenshots.rs\`."
            else
              echo "::warning::Rendering the screenshot scenarios failed."
            fi
          fi
          if compgen -G "$SHOTS/*.png" > /dev/null; then
            RAW="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/screenshots/issue-$ISSUE"
            UPLOADED=()
            for f in "$SHOTS"/*.png; do
              name=$(basename "$f")
              if ! [[ "$name" =~ ^[a-z0-9-]+\.png$ ]] || [ "$(stat -c %s "$f")" -gt 5000000 ]; then
                echo "::warning::Skipping screenshot $name (name or size)."
                continue
              fi
              API="repos/$GITHUB_REPOSITORY/contents/issue-$ISSUE/$name"
              SHA=$(gh api "$API?ref=screenshots" --jq .sha 2>/dev/null) || SHA=""
              base64 -w0 "$f" > "$RUNNER_TEMP/shot.b64"
              jq -n --rawfile content "$RUNNER_TEMP/shot.b64" --arg sha "$SHA" \
                  --arg message "docs: screenshot for #$ISSUE" \
                  '{message: $message, content: $content, branch: "screenshots"}
                   + (if $sha == "" then {} else {sha: $sha} end)' \
                  > "$RUNNER_TEMP/shot.json"
              if gh api -X PUT "$API" --input "$RUNNER_TEMP/shot.json" --silent; then
                UPLOADED+=("$name")
              else
                echo "::warning::Uploading screenshot $name failed."
              fi
            done
            sed -i "s#](screenshots/#]($RAW/#g" "$BODY_FILE"
            if [ "${#UPLOADED[@]}" -gt 0 ] && ! grep -q "]($RAW/" "$BODY_FILE"; then
              {
                printf '\n## Screenshots\n\n'
                if [ -n "$SHOT_NOTE" ]; then
                  printf '%s\n\n' "$SHOT_NOTE"
                fi
                for name in "${UPLOADED[@]}"; do
                  printf '![%s](%s/%s)\n\n' "${name%.png}" "$RAW" "$name"
                done
              } >> "$BODY_FILE"
            fi
          fi

          DRAFT=()
          if [ "$GATE" != "passed" ]; then
            DRAFT=(--draft)
            # Backticks are Markdown here, not command substitution.
            # shellcheck disable=SC2016
            printf '\n> ❌ **Verification gate failed** (`scripts/check.sh full`); see the [workflow run](%s/%s/actions/runs/%s). Opened as draft.\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$BODY_FILE"
          fi
          if [ "$AGENT_OUTCOME" != "success" ]; then
            # Backticks are Markdown here, not command substitution.
            # shellcheck disable=SC2016
            printf '\n> ⚠️ **Partial work**: the agent did not report success (outcome: `%s`, often the turn budget). Check the diff for completeness.\n' \
              "$AGENT_OUTCOME" >> "$BODY_FILE"
          fi

          PR_URL=$(GH_TOKEN="$PR_TOKEN" gh pr create --base main --head "$BRANCH" "${DRAFT[@]}" \
            --title "$TITLE" --body-file "$BODY_FILE")

          # Without PR_CREATION_TOKEN the PR triggers no `pull_request` run,
          # so start the required CI explicitly (workflow_dispatch is allowed
          # for GITHUB_TOKEN); its checks attach to the branch head.
          if [ "$HAS_PR_TOKEN" != "true" ]; then
            gh workflow run ci.yml --ref "$BRANCH"
          fi

          # Tick the checklist items the agent judged done. Merged onto the
          # current body, so edits made meanwhile survive and the agent can
          # change nothing but checkbox state. The script is taken from the
          # base commit so the agent's branch cannot alter it.
          CHECKS="checklist not updated"
          EDITED="$RUNNER_TEMP/issue-body.md"
          if [ -s "$EDITED" ]; then
            CURRENT="$RUNNER_TEMP/issue-body-current.md"
            MERGED="$RUNNER_TEMP/issue-body-merged.md"
            gh issue view "$ISSUE" --json body --jq .body > "$CURRENT"
            git show "$BASE_SHA:.github/scripts/merge-checklist.py" > "$RUNNER_TEMP/merge-checklist.py"
            if python3 "$RUNNER_TEMP/merge-checklist.py" "$CURRENT" "$EDITED" \
                > "$MERGED" 2> "$RUNNER_TEMP/merge.log"; then
              cat "$RUNNER_TEMP/merge.log"
              if ! grep -q "^0 " "$RUNNER_TEMP/merge.log"; then
                gh issue edit "$ISSUE" --body-file "$MERGED"
              fi
              CHECKS=$(cat "$RUNNER_TEMP/merge.log")
            else
              echo "::warning::Issue checklist not updated: $(cat "$RUNNER_TEMP/merge.log")"
              CHECKS="checklist not updated: agent changed more than checkbox state"
            fi
          fi

          gh issue comment "$ISSUE" --body \
            "🤖 Claude opened a PR for this issue: $PR_URL (agent outcome: \`$AGENT_OUTCOME\`; gate $GATE; $CHECKS)."

      # The transcript can contain repository content and command output, and
      # logs and artifacts of a public repository are readable by any
      # signed-in user. So it is kept only when something went wrong, and
      # only encrypted to the maintainer's age key (repository variable
      # TRANSCRIPT_AGE_RECIPIENT, an `age1…` public key). Decrypt with:
      #   age -d -i key.txt claude-transcript.json.age > transcript.json
      - name: Encrypt agent transcript
        id: transcript
        if: >-
          ${{ !cancelled() && steps.claude.outputs.execution_file != '' &&
              (steps.claude.outcome != 'success' ||
               steps.publish.outcome == 'failure' ||
               steps.publish.outputs.needs_transcript == 'true') }}
        env:
          RECIPIENT: ${{ vars.TRANSCRIPT_AGE_RECIPIENT }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          if ! [[ "$RECIPIENT" =~ ^age1[0-9a-z]+$ ]]; then
            echo "::warning::TRANSCRIPT_AGE_RECIPIENT is not set; transcript not kept."
            exit 0
          fi
          if [ ! -s "$EXEC_FILE" ]; then
            echo "::warning::No transcript file found."
            exit 0
          fi
          command -v age > /dev/null || sudo apt-get install -y age
          age -r "$RECIPIENT" -o "$RUNNER_TEMP/claude-transcript.json.age" "$EXEC_FILE"
          echo "file=$RUNNER_TEMP/claude-transcript.json.age" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted transcript
        if: ${{ !cancelled() && steps.transcript.outputs.file != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-transcript-issue-${{ inputs.issue }}
          path: ${{ steps.transcript.outputs.file }}
          retention-days: 14
