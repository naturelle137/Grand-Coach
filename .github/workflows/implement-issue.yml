# SPDX-License-Identifier: EUPL-1.2
name: Implement issue

# Manually triggered: Claude Code implements exactly the issue passed in and
# opens a regular (non-draft) PR to `main`. No schedule, no automatic issue
# selection, no automated review bots; a human reviews the PR (D-27).

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to implement'
        required: true
        type: string
      model:
        description: 'Model alias or pinned ID (e.g. opus, sonnet)'
        required: false
        type: string
        default: 'opus'
      effort:
        description: 'Reasoning effort (low | medium | high | xhigh | max)'
        required: false
        type: string
        default: 'medium'
      max_turns:
        description: 'Turn budget for the agent'
        required: false
        type: string
        default: '200'

# One run per issue at a time; never cancel an in-flight implementation.
concurrency:
  group: implement-issue-${{ inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write # dispatch CI for the PR (D-30)
  id-token: write # required by anthropics/claude-code-action (OIDC)

jobs:
  implement:
    name: Implement #${{ inputs.issue }}
    runs-on: ubuntu-latest
    # Must exceed what the turn budget can consume, so the agent's own cap is
    # hit first and the push step below can still save partial work.
    timeout-minutes: 150
    env:
      ISSUE: ${{ inputs.issue }}
      BRANCH: claude/issue-${{ inputs.issue }}
    steps:
      - name: Validate issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Issue input must be a number, got '$ISSUE'."
            exit 1
          fi
          STATE=$(gh issue view "$ISSUE" --json state --jq .state) || {
            echo "::error::Issue #$ISSUE not found."
            exit 1
          }
          if [ "$STATE" != "OPEN" ]; then
            echo "::error::Issue #$ISSUE is $STATE, not OPEN."
            exit 1
          fi
          if gh api "repos/$GH_REPO/branches/$BRANCH" --silent 2>/dev/null; then
            echo "::error::Branch $BRANCH already exists; delete it or finish its PR first."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          # A PAT is only needed once PRs should trigger other workflows (CI);
          # PRs created with GITHUB_TOKEN do not trigger them.
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}

      # Always installed, so an issue that creates the Cargo workspace can
      # build and test it, too.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        if: ${{ hashFiles('Cargo.lock') != '' }}
        uses: Swatinem/rust-cache@v2

      - name: Create branch
        run: |
          git config user.name 'grand-coach-bot'
          git config user.email 'grand-coach-bot@users.noreply.github.com'
          # The agent's commits pass the pre-commit gate (D-30).
          git config core.hooksPath .githooks
          git switch -c "$BRANCH"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Implement via Claude Code
        id: claude
        # Agent errors (e.g. turn budget exhausted) must not discard partial
        # work; the push step reports the outcome instead.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # API billing instead of the subscription:
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The procedure lives in the project skill
          # `.claude/skills/implement-issue/SKILL.md`; only CI specifics here.
          prompt: |
            /implement-issue ${{ inputs.issue }}

            CI notes (the skill is `.claude/skills/implement-issue/SKILL.md`):
            - You run unattended on branch claude/issue-${{ inputs.issue }},
              already created from `main`. Nobody can answer questions; make
              reasonable decisions and document them in the PR body.
            - End every commit message with
              `Co-Authored-By: Claude <noreply@anthropic.com>`.
            - Do not push, open the PR or edit the issue; the workflow does
              that afterwards. Write instead:
              - the PR title to `$RUNNER_TEMP/pr-title.txt`,
              - the PR body to `$RUNNER_TEMP/pr-body.md`, ending with
                `🤖 Generated with [Claude Code](https://claude.com/claude-code)`,
              - the issue body with the genuinely done checklist items ticked
                to `$RUNNER_TEMP/issue-body.md`. The workflow rejects any
                change other than `[ ]` → `[x]`.
            - Do not edit `.github/workflows/**` or security settings.
          # claude-code-action does not grant Bash by default and nobody can
          # approve tool prompts in CI. `Task` enables subagents from
          # `.claude/agents/`. Safety rests on human review of the PR.
          claude_args: |
            --model ${{ inputs.model }}
            --effort ${{ inputs.effort }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,Task,TodoWrite,WebFetch,WebSearch,Skill"

      - name: Push branch and open PR
        # Runs even when the agent failed, so partial work is not lost.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.AUTOMATION_PAT != '' }}
          BOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" = "$BASE_SHA" ]; then
            echo "No commits produced for #$ISSUE (agent outcome: $AGENT_OUTCOME)."
            gh issue comment "$ISSUE" --body \
              "🤖 Claude produced no commits for this issue (agent outcome: \`$AGENT_OUTCOME\`). See the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            exit 0
          fi

          # claude-code-action repoints origin at its own token, which may not
          # be allowed to push; re-establish auth with GH_TOKEN.
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git

          # Full verification gate (D-30), taken from the base commit so the
          # agent's branch cannot weaken it. A red gate still pushes (partial
          # work survives) but opens a draft PR; CI blocks the merge anyway.
          GATE="passed"
          if git cat-file -e "$BASE_SHA:scripts/check.sh" 2>/dev/null; then
            git show "$BASE_SHA:scripts/check.sh" > "$RUNNER_TEMP/check.sh"
            bash "$RUNNER_TEMP/check.sh" full --base "$BASE_SHA" || GATE="failed"
          fi
          # The gate just ran; skip the pre-push hook.
          git push --no-verify --set-upstream origin "$BRANCH"

          TITLE_FILE="$RUNNER_TEMP/pr-title.txt"
          BODY_FILE="$RUNNER_TEMP/pr-body.md"
          if [ -s "$TITLE_FILE" ]; then
            TITLE=$(head -n 1 "$TITLE_FILE")
          else
            TITLE="feat: $(gh issue view "$ISSUE" --json title --jq .title) (#$ISSUE)"
          fi
          if [ ! -s "$BODY_FILE" ]; then
            printf 'Refs #%s\n\nClaude did not write a PR description; treat this as work in progress.\n' \
              "$ISSUE" > "$BODY_FILE"
          fi
          DRAFT=()
          if [ "$GATE" != "passed" ]; then
            DRAFT=(--draft)
            # Backticks are Markdown here, not command substitution.
            # shellcheck disable=SC2016
            printf '\n> ❌ **Verification gate failed** (`scripts/check.sh full`); see the [workflow run](%s/%s/actions/runs/%s). Opened as draft.\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$BODY_FILE"
          fi
          if [ "$AGENT_OUTCOME" != "success" ]; then
            # Backticks are Markdown here, not command substitution.
            # shellcheck disable=SC2016
            printf '\n> ⚠️ **Partial work**: the agent did not report success (outcome: `%s`, often the turn budget). Check the diff for completeness.\n' \
              "$AGENT_OUTCOME" >> "$BODY_FILE"
          fi

          PR_URL=$(gh pr create --base main --head "$BRANCH" "${DRAFT[@]}" \
            --title "$TITLE" --body-file "$BODY_FILE")

          # Without a PAT the PR triggers no `pull_request` run, so start the
          # required CI explicitly (workflow_dispatch is allowed for
          # GITHUB_TOKEN); its checks attach to the branch head.
          if [ "$HAS_PAT" != "true" ]; then
            GH_TOKEN="$BOT_TOKEN" gh workflow run ci.yml --ref "$BRANCH"
          fi

          # Tick the checklist items the agent judged done. Merged onto the
          # current body, so edits made meanwhile survive and the agent can
          # change nothing but checkbox state. The script is taken from the
          # base commit so the agent's branch cannot alter it.
          CHECKS="checklist not updated"
          EDITED="$RUNNER_TEMP/issue-body.md"
          if [ -s "$EDITED" ]; then
            CURRENT="$RUNNER_TEMP/issue-body-current.md"
            MERGED="$RUNNER_TEMP/issue-body-merged.md"
            gh issue view "$ISSUE" --json body --jq .body > "$CURRENT"
            git show "$BASE_SHA:.github/scripts/merge-checklist.py" > "$RUNNER_TEMP/merge-checklist.py"
            if python3 "$RUNNER_TEMP/merge-checklist.py" "$CURRENT" "$EDITED" \
                > "$MERGED" 2> "$RUNNER_TEMP/merge.log"; then
              cat "$RUNNER_TEMP/merge.log"
              if ! grep -q "^0 " "$RUNNER_TEMP/merge.log"; then
                gh issue edit "$ISSUE" --body-file "$MERGED"
              fi
              CHECKS=$(cat "$RUNNER_TEMP/merge.log")
            else
              echo "::warning::Issue checklist not updated: $(cat "$RUNNER_TEMP/merge.log")"
              CHECKS="checklist not updated: agent changed more than checkbox state"
            fi
          fi

          gh issue comment "$ISSUE" --body \
            "🤖 Claude opened a PR for this issue: $PR_URL (agent outcome: \`$AGENT_OUTCOME\`; gate $GATE; $CHECKS)."
