# SPDX-License-Identifier: EUPL-1.2
[package]
name = "gui-egui"
description = "egui desktop frontend of Grand-Coach"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "grand-coach"
path = "src/main.rs"

[dependencies]
skat-app.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
fluent-bundle = "0.16"
unic-langid = "0.9"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
rand_chacha.workspace = true

[lints]
workspace = true
